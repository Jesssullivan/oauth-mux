name: Registry Dry Run

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type registry-dry-run to contact authenticated registry endpoints without publishing"
        required: true
        type: string
      version:
        description: "Version to stage and dry-run"
        required: false
        default: "0.1.12"
        type: string
      lanes:
        description: "Comma-separated lanes: plan,github,npm,homebrew,system"
        required: false
        default: "plan"
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  registry-dry-run:
    name: Registry dry-run
    if: inputs.confirm == 'registry-dry-run'
    runs-on: ubuntu-latest
    env:
      OMUX_GLOBAL_SOPS_B64_PRESENT: ${{ secrets.OMUX_GLOBAL_SOPS_B64 != '' }}
      OMUX_GLOBAL_SOPS_REPOSITORY_PRESENT: ${{ vars.OMUX_GLOBAL_SOPS_REPOSITORY != '' }}
      OMUX_HOMEBREW_TAP_REPOSITORY_PRESENT: ${{ vars.OMUX_HOMEBREW_TAP_REPOSITORY != '' }}
      OMUX_HOMEBREW_TAP_DIR_PRESENT: ${{ vars.OMUX_HOMEBREW_TAP_DIR != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Decode global SOPS file
        if: env.OMUX_GLOBAL_SOPS_B64_PRESENT == 'true'
        shell: bash
        env:
          OMUX_GLOBAL_SOPS_B64: ${{ secrets.OMUX_GLOBAL_SOPS_B64 }}
        run: |
          set -euo pipefail
          global_sops="$RUNNER_TEMP/omux-global.sops.yaml"
          printf '%s' "$OMUX_GLOBAL_SOPS_B64" | base64 -d > "$global_sops"
          chmod 0600 "$global_sops"
          echo "OMUX_NPM_TOKEN_SOPS_FILE=$global_sops" >> "$GITHUB_ENV"

      - name: Checkout global SOPS repo
        if: env.OMUX_GLOBAL_SOPS_B64_PRESENT != 'true' && env.OMUX_GLOBAL_SOPS_REPOSITORY_PRESENT == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.OMUX_GLOBAL_SOPS_REPOSITORY }}
          ref: ${{ vars.OMUX_GLOBAL_SOPS_REF || 'main' }}
          path: .global-sops
          token: ${{ secrets.GF_ACTIONS_TOKEN || github.token }}
          persist-credentials: false

      - name: Configure checked-out SOPS file
        if: env.OMUX_GLOBAL_SOPS_B64_PRESENT != 'true' && env.OMUX_GLOBAL_SOPS_REPOSITORY_PRESENT == 'true'
        shell: bash
        env:
          OMUX_GLOBAL_SOPS_FILE: ${{ vars.OMUX_GLOBAL_SOPS_FILE || 'nix/secrets/common.yaml' }}
        run: |
          set -euo pipefail
          echo "OMUX_NPM_TOKEN_SOPS_FILE=$PWD/.global-sops/$OMUX_GLOBAL_SOPS_FILE" >> "$GITHUB_ENV"

      - name: Checkout Homebrew tap
        if: contains(inputs.lanes, 'homebrew') && env.OMUX_HOMEBREW_TAP_REPOSITORY_PRESENT == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.OMUX_HOMEBREW_TAP_REPOSITORY }}
          ref: ${{ vars.OMUX_HOMEBREW_TAP_REF || 'main' }}
          path: .homebrew-tap
          token: ${{ secrets.GF_ACTIONS_TOKEN || github.token }}
          persist-credentials: false

      - name: Configure Homebrew tap checkout
        if: contains(inputs.lanes, 'homebrew') && env.OMUX_HOMEBREW_TAP_REPOSITORY_PRESENT == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "OMUX_HOMEBREW_TAP_DIR=$PWD/.homebrew-tap" >> "$GITHUB_ENV"

      - name: Configure existing Homebrew tap path
        if: contains(inputs.lanes, 'homebrew') && env.OMUX_HOMEBREW_TAP_REPOSITORY_PRESENT != 'true' && env.OMUX_HOMEBREW_TAP_DIR_PRESENT == 'true'
        shell: bash
        env:
          OMUX_HOMEBREW_TAP_DIR_VAR: ${{ vars.OMUX_HOMEBREW_TAP_DIR }}
        run: |
          set -euo pipefail
          echo "OMUX_HOMEBREW_TAP_DIR=$OMUX_HOMEBREW_TAP_DIR_VAR" >> "$GITHUB_ENV"

      - name: Install Homebrew
        if: contains(inputs.lanes, 'homebrew')
        shell: bash
        run: |
          set -euo pipefail
          if command -v brew >/dev/null 2>&1; then
            brew_path="$(command -v brew)"
          else
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            brew_path="/home/linuxbrew/.linuxbrew/bin/brew"
          fi
          echo "$(dirname "$brew_path")" >> "$GITHUB_PATH"
          echo "OMUX_BREW_BIN=$brew_path" >> "$GITHUB_ENV"

      - name: Stage release proof
        run: nix develop --command just release-proof-local "${{ inputs.version }}"

      - name: Run registry dry-run
        shell: bash
        env:
          OMUX_REGISTRY_DRY_RUN_CONFIRM: registry-dry-run
          OMUX_REGISTRY_LANES: ${{ inputs.lanes }}
          OMUX_NPM_TOKEN_SOPS_KEY: ${{ vars.OMUX_NPM_TOKEN_SOPS_KEY || '.api.npm_token' }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN || '' }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || '' }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          OMUX_HOMEBREW_TAP_NAME: ${{ vars.OMUX_HOMEBREW_TAP_NAME || '' }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: nix develop --command ./scripts/registry-dry-run.sh "${{ inputs.version }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registry-dry-run-${{ inputs.version }}
          path: dist/out/**/handoff/
          if-no-files-found: ignore
