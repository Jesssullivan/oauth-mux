name: Remote Validate
run-name: Remote Validate ${{ inputs.request_id || github.run_id }} ${{ inputs.target || 'e2e' }}

on:
  schedule:
    # Weekly synthetic e2e on the remote runner (no provider spend) — the
    # CI-enforcement cadence for the TIN-1852 session-lifecycle gate.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      target:
        description: "Validation target to run on the GloriousFlywheel runner"
        required: true
        default: "check"
        type: choice
        options:
          - check
          - test
          - build
          - build-release
          - build-small
          - e2e
          - first-run-e2e
          - release-proof
          - v02-stage2-conformance
          - v02-benchmark
      candidate_sha:
        description: "Exact 40-hex candidate commit for v0.2 proof targets"
        required: false
        default: ""
        type: string
      candidate_ref:
        description: "Canonical refs/heads/... or refs/tags/... for v0.2 proof targets"
        required: false
        default: ""
        type: string
      version:
        description: "Release version for release-proof"
        required: false
        type: string
      request_id:
        description: "Unique caller request id for dispatch/run correlation"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  remote-validate:
    name: ${{ inputs.target || 'e2e' }} on GloriousFlywheel
    runs-on: tinyland-nix
    timeout-minutes: 45
    steps:
      - name: Validate dispatch envelope
        shell: bash
        env:
          OMUX_REMOTE_TARGET: ${{ inputs.target || 'e2e' }}
          OMUX_V02_CANDIDATE_SHA: ${{ inputs.candidate_sha || '' }}
          OMUX_V02_CANDIDATE_REF: ${{ inputs.candidate_ref || '' }}
          OMUX_V02_WORKFLOW_EVENT_SHA: ${{ github.sha }}
          OMUX_V02_WORKFLOW_EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "${OMUX_REMOTE_TARGET}" in
            v02-stage2-conformance|v02-benchmark)
              [[ "${OMUX_V02_CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
                echo "::error::v0.2 proof target requires an exact 40-hex candidate_sha"
                exit 2
              }
              if [ "${OMUX_V02_WORKFLOW_EVENT_SHA}" != "${OMUX_V02_CANDIDATE_SHA}" ]; then
                echo "::error::workflow event SHA does not equal candidate_sha"
                exit 1
              fi
              case "${OMUX_V02_CANDIDATE_REF}" in
                refs/heads/?*|refs/tags/?*)
                  ;;
                *)
                  echo "::error::v0.2 proof target requires a canonical candidate_ref"
                  exit 2
                  ;;
              esac
              if [ "${OMUX_V02_WORKFLOW_EVENT_REF}" != "${OMUX_V02_CANDIDATE_REF}" ]; then
                echo "::error::workflow event ref does not equal candidate_ref"
                exit 1
              fi
              ;;
            *)
              if [ -n "${OMUX_V02_CANDIDATE_SHA}" ] || [ -n "${OMUX_V02_CANDIDATE_REF}" ]; then
                echo "::error::candidate_sha and candidate_ref are only valid for v0.2 proof targets"
                exit 2
              fi
              ;;
          esac

      - name: Checkout immutable v0.2 candidate
        if: ${{ inputs.target == 'v02-stage2-conformance' || inputs.target == 'v02-benchmark' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate_sha }}

      - name: Checkout generic validation ref
        if: ${{ inputs.target != 'v02-stage2-conformance' && inputs.target != 'v02-benchmark' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Verify detached v0.2 candidate checkout
        if: ${{ inputs.target == 'v02-stage2-conformance' || inputs.target == 'v02-benchmark' }}
        shell: bash
        env:
          OMUX_V02_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          OMUX_V02_WORKFLOW_EVENT_SHA: ${{ github.sha }}
        run: |
          ./scripts/v02-proof-provenance-local.sh assert-checkout \
            "${OMUX_V02_CANDIDATE_SHA}" \
            "${OMUX_V02_WORKFLOW_EVENT_SHA}"

      - name: Checkout GloriousFlywheel action
        uses: ./.github/actions/checkout-gloriousflywheel
        with:
          app-id: ${{ secrets.GF_ACTIONS_APP_ID }}
          private-key: ${{ secrets.GF_ACTIONS_APP_PRIVATE_KEY }}

      - name: Run selected target
        uses: ./.gloriousflywheel/.github/actions/nix-job
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN || '' }}
          OMUX_REMOTE_REQUEST_ID: ${{ inputs.request_id || github.run_id }}
          OMUX_REMOTE_TARGET: ${{ inputs.target || 'e2e' }}
          OMUX_REQUESTED_RELEASE_VERSION: ${{ inputs.version || '' }}
          OMUX_V02_CANDIDATE_SHA: ${{ inputs.candidate_sha || '' }}
          OMUX_V02_WORKFLOW_EVENT_SHA: ${{ github.sha }}
          OMUX_V02_WORKFLOW_RUN_ID: ${{ github.run_id }}
          OMUX_V02_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          OMUX_V02_GF_TARGET_CLASS: tinyland-nix
          OMUX_V02_GF_ACTION_SHA: 2357988536f1f6258291c363e1428962b6cced1b
        with:
          attic-public-key: ${{ vars.ATTIC_PUBLIC_KEY || '' }}
          push-cache: "false"
          command: |
            set -euo pipefail
            test -n "${ATTIC_SERVER:-}"
            test -n "${ATTIC_CACHE:-}"
            test -n "${NIX_CONFIG:-}"

            run_with_timeout() {
              local label="$1"
              local duration="$2"
              shift 2

              if ! command -v timeout >/dev/null 2>&1; then
                echo "::warning::GNU timeout is unavailable; running ${label} without an inner timeout"
                "$@"
                return
              fi

              set +e
              timeout --foreground "${duration}" "$@"
              local status=$?
              set -e

              if [ "${status}" -eq 124 ]; then
                echo "::error::${label} timed out after ${duration}"
              fi

              return "${status}"
            }

            run_selected_target() {
              case "${OMUX_REMOTE_TARGET}" in
                check)
                  run_with_timeout "remote check" "${OMUX_REMOTE_CHECK_TIMEOUT:-30m}" \
                    nix develop --command just check-local
                  ;;
                test)
                  run_with_timeout "remote test" "${OMUX_REMOTE_TEST_TIMEOUT:-20m}" \
                    nix develop --command zig build test
                  ;;
                build)
                  run_with_timeout "remote build" "${OMUX_REMOTE_BUILD_TIMEOUT:-20m}" \
                    nix develop --command zig build
                  ;;
                build-release)
                  run_with_timeout "remote release build" "${OMUX_REMOTE_BUILD_TIMEOUT:-20m}" \
                    nix develop --command zig build -Doptimize=ReleaseSafe
                  ;;
                build-small)
                  run_with_timeout "remote small build" "${OMUX_REMOTE_BUILD_TIMEOUT:-20m}" \
                    nix develop --command zig build -Doptimize=ReleaseSmall
                  ;;
                e2e)
                  run_with_timeout "remote e2e" "${OMUX_REMOTE_E2E_TIMEOUT:-20m}" \
                    nix develop --command just e2e-local
                  ;;
                first-run-e2e)
                  run_with_timeout "remote first-run e2e" "${OMUX_REMOTE_E2E_TIMEOUT:-20m}" \
                    nix develop --command just first-run-e2e-local
                  ;;
                release-proof)
                  release_version="$(./scripts/resolve-release-version.sh "${OMUX_REQUESTED_RELEASE_VERSION}")"
                  run_with_timeout "remote release proof" "${OMUX_REMOTE_RELEASE_PROOF_TIMEOUT:-40m}" \
                    nix develop --command just release-proof-local "${release_version}"
                  ;;
                v02-stage2-conformance)
                  candidate_tree="$(git rev-parse --verify 'HEAD^{tree}')"
                  stage2_cache_root="$(mktemp -d "${RUNNER_TEMP}/omux-stage2-zig.XXXXXX")"
                  set +e
                  run_with_timeout \
                    "v0.2 Stage 2 observer" \
                    "${OMUX_REMOTE_STAGE2_TIMEOUT:-20m}" \
                    nix develop --command env \
                      ZIG_LOCAL_CACHE_DIR="${stage2_cache_root}/local" \
                      ZIG_GLOBAL_CACHE_DIR="${stage2_cache_root}/global" \
                      zig build v02-stage2-observe \
                      -Dv02-candidate-sha="${OMUX_V02_CANDIDATE_SHA}" \
                      -Dv02-candidate-tree="${candidate_tree}" \
                      -Dv02-workflow-run-id="${OMUX_V02_WORKFLOW_RUN_ID}" \
                      -Dv02-workflow-run-attempt="${OMUX_V02_WORKFLOW_RUN_ATTEMPT}" \
                      -Dv02-gf-target-class="${OMUX_V02_GF_TARGET_CLASS}"
                  observer_status=$?
                  set -e
                  rm -rf "$stage2_cache_root"
                  rm -f "${GITHUB_WORKSPACE}/v02-stage2-observations.json.tmp"
                  if [ -f "${GITHUB_WORKSPACE}/v02-stage2-observations.json" ] &&
                    ./scripts/v02-stage2-observation-local.sh verify \
                      "${GITHUB_WORKSPACE}/v02-stage2-observations.json" \
                      "${OMUX_V02_CANDIDATE_SHA}" \
                      "${candidate_tree}" \
                      "${OMUX_V02_WORKFLOW_RUN_ID}" \
                      "${OMUX_V02_WORKFLOW_RUN_ATTEMPT}" \
                      "${OMUX_V02_GF_TARGET_CLASS}"
                  then
                    ./scripts/v02-proof-predicate-manifest-local.sh reduce-stage2 \
                      "${GITHUB_WORKSPACE}/v02-stage2-observations.json" \
                      "${GITHUB_WORKSPACE}/v02-proof-predicate-manifest.json" \
                      "${OMUX_V02_CANDIDATE_SHA}" \
                      "${candidate_tree}" \
                      "${OMUX_V02_WORKFLOW_RUN_ID}" \
                      "${OMUX_V02_WORKFLOW_RUN_ATTEMPT}" \
                      "${OMUX_V02_GF_TARGET_CLASS}"
                  else
                    ./scripts/v02-proof-predicate-manifest-local.sh emit-missing \
                      "${OMUX_REMOTE_TARGET}" \
                      "${GITHUB_WORKSPACE}/v02-proof-predicate-manifest.json"
                  fi
                  if [ "$observer_status" -ne 0 ]; then
                    echo "::error::Claude fake-upstream observer failed with status ${observer_status}"
                    return "$observer_status"
                  fi
                  ./scripts/v02-proof-predicate-manifest-local.sh require-pass \
                    "${OMUX_REMOTE_TARGET}" \
                    "${GITHUB_WORKSPACE}/v02-proof-predicate-manifest.json"
                  ;;
                v02-benchmark)
                  ./scripts/v02-proof-predicate-manifest-local.sh emit-missing \
                    "${OMUX_REMOTE_TARGET}" \
                    "${GITHUB_WORKSPACE}/v02-proof-predicate-manifest.json"
                  candidate_tree="$(git rev-parse --verify 'HEAD^{tree}')"
                  ./scripts/v02-benchmark-metrics-local.sh emit-missing \
                    "${GITHUB_WORKSPACE}/v02-benchmark-metrics.json" \
                    "${OMUX_V02_CANDIDATE_SHA}" \
                    "${candidate_tree}" \
                    "${OMUX_V02_WORKFLOW_RUN_ID}" \
                    "${OMUX_V02_WORKFLOW_RUN_ATTEMPT}" \
                    "${OMUX_V02_GF_TARGET_CLASS}"
                  ./scripts/v02-proof-predicate-manifest-local.sh require-pass \
                    "${OMUX_REMOTE_TARGET}" \
                    "${GITHUB_WORKSPACE}/v02-proof-predicate-manifest.json"
                  ./scripts/v02-benchmark-metrics-local.sh require-pass \
                    "${GITHUB_WORKSPACE}/v02-benchmark-metrics.json" \
                    "${OMUX_V02_CANDIDATE_SHA}" \
                    "${candidate_tree}" \
                    "${OMUX_V02_WORKFLOW_RUN_ID}" \
                    "${OMUX_V02_WORKFLOW_RUN_ATTEMPT}" \
                    "${OMUX_V02_GF_TARGET_CLASS}"
                  ;;
                *)
                  echo "::error::unsupported remote validation target: ${OMUX_REMOTE_TARGET}"
                  return 2
                  ;;
              esac
            }

            case "${OMUX_REMOTE_TARGET}" in
              v02-stage2-conformance|v02-benchmark)
                started_at_utc="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                if run_selected_target; then
                  proof_status=0
                  result=passed
                else
                  proof_status=$?
                  result=failed
                fi
                ./scripts/v02-proof-provenance-local.sh assert-post-run \
                  "${OMUX_V02_CANDIDATE_SHA}" \
                  "${OMUX_V02_WORKFLOW_EVENT_SHA}" \
                  "${OMUX_REMOTE_TARGET}" \
                  "${OMUX_V02_GF_ACTION_SHA}"
                finished_at_utc="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

                ./scripts/v02-proof-provenance-local.sh emit \
                  "${GITHUB_WORKSPACE}/v02-proof-provenance.json" \
                  "${OMUX_V02_CANDIDATE_SHA}" \
                  "${OMUX_V02_WORKFLOW_EVENT_SHA}" \
                  "${OMUX_REMOTE_TARGET}" \
                  "${OMUX_V02_WORKFLOW_RUN_ID}" \
                  "${OMUX_V02_WORKFLOW_RUN_ATTEMPT}" \
                  "${OMUX_V02_GF_TARGET_CLASS}" \
                  "${OMUX_V02_GF_ACTION_SHA}" \
                  "${started_at_utc}" \
                  "${finished_at_utc}" \
                  "${result}"
                exit "${proof_status}"
                ;;
              *)
                run_selected_target
                ;;
            esac

      - name: Upload v0.2 proof provenance
        if: ${{ always() && (inputs.target == 'v02-stage2-conformance' || inputs.target == 'v02-benchmark') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v02-proof-provenance-${{ github.run_attempt }}
          path: v02-proof-provenance.json
          if-no-files-found: error

      - name: Upload v0.2 proof predicate manifest
        if: ${{ always() && (inputs.target == 'v02-stage2-conformance' || inputs.target == 'v02-benchmark') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v02-proof-predicates-${{ inputs.target }}-${{ github.run_attempt }}
          path: v02-proof-predicate-manifest.json
          if-no-files-found: error

      - name: Upload v0.2 Stage 2 observations
        if: ${{ always() && inputs.target == 'v02-stage2-conformance' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v02-stage2-observations-${{ github.run_attempt }}
          path: v02-stage2-observations.json
          if-no-files-found: error

      - name: Upload v0.2 benchmark metrics
        if: ${{ always() && inputs.target == 'v02-benchmark' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v02-proof-benchmark-metrics-${{ github.run_attempt }}
          path: v02-benchmark-metrics.json
          if-no-files-found: error
