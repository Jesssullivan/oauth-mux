name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

      - name: Build release
        run: zig build -Doptimize=ReleaseSafe

      - name: Binary size
        run: ls -lh zig-out/bin/oauth-mux

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - x86_64-macos
          - aarch64-macos
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Build ${{ matrix.target }}
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe

      - name: Check binary
        run: |
          ls -lh zig-out/bin/oauth-mux
          file zig-out/bin/oauth-mux

      - uses: actions/upload-artifact@v4
        with:
          name: oauth-mux-${{ matrix.target }}
          path: zig-out/bin/oauth-mux

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Nix build
        run: nix build .#

      - name: Nix check
        run: nix flake check
