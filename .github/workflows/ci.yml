name: CI

on:
  push:
    branches: [main, initial-implementation]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cache-first:
    name: GloriousFlywheel cache-first check
    runs-on: tinyland-nix
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run cache-first validation
        uses: tinyland-inc/GloriousFlywheel/.github/actions/nix-job@main
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN || '' }}
        with:
          attic-public-key: ${{ vars.ATTIC_PUBLIC_KEY || '' }}
          push-cache: ${{ github.event_name == 'push' && 'true' || 'false' }}
          command: |
            set -euxo pipefail
            test -n "${ATTIC_SERVER:-}"
            test -n "${ATTIC_CACHE:-}"
            test -n "${NIX_CONFIG:-}"
            nix develop --command just check-local

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

      - name: Validate examples
        run: |
          for cfg in examples/*.config.json; do
            OMUX_CONFIG="$PWD/$cfg" ./zig-out/bin/oauth-mux config validate
          done

      - name: Build release
        run: zig build -Doptimize=ReleaseSafe

      - name: Binary size
        run: ls -lh zig-out/bin/oauth-mux

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows
          - aarch64-windows
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Build ${{ matrix.target }}
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe

      - name: Check binary
        run: |
          ls -lh zig-out/bin/oauth-mux*
          file zig-out/bin/oauth-mux*

      - uses: actions/upload-artifact@v4
        with:
          name: oauth-mux-${{ matrix.target }}
          path: zig-out/bin/oauth-mux*

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Nix build
        run: nix build .#

      - name: Nix check
        run: nix flake check
