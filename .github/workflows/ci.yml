name: CI

on:
  push:
    branches: [main, initial-implementation]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  cache-first:
    name: GloriousFlywheel cache-first check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: tinyland-nix
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect GloriousFlywheel action access
        id: gf
        shell: bash
        env:
          GF_ACTIONS_TOKEN: ${{ secrets.GF_ACTIONS_TOKEN || '' }}
        run: |
          if [ -n "${GF_ACTIONS_TOKEN:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require remote runner substrate
        if: steps.gf.outputs.enabled != 'true'
        shell: bash
        run: |
          echo "GF_ACTIONS_TOKEN is required for CI validation." >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow is remote-first and has no GitHub-hosted local fallback." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Checkout GloriousFlywheel action
        if: steps.gf.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: tinyland-inc/GloriousFlywheel
          ref: main
          path: .gloriousflywheel
          token: ${{ secrets.GF_ACTIONS_TOKEN }}
          persist-credentials: false

      - name: Run cache-first validation
        if: steps.gf.outputs.enabled == 'true'
        uses: ./.gloriousflywheel/.github/actions/nix-job
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN || '' }}
        with:
          attic-public-key: ${{ vars.ATTIC_PUBLIC_KEY || '' }}
          push-cache: ${{ github.event_name == 'push' && 'true' || 'false' }}
          command: |
            set -euxo pipefail
            test -n "${ATTIC_SERVER:-}"
            test -n "${ATTIC_CACHE:-}"
            test -n "${NIX_CONFIG:-}"

            run_with_timeout() {
              local label="$1"
              local duration="$2"
              shift 2

              if ! command -v timeout >/dev/null 2>&1; then
                echo "::warning::GNU timeout is unavailable; running ${label} without an inner timeout"
                "$@"
                return
              fi

              set +e
              timeout --foreground "${duration}" "$@"
              local status=$?
              set -e

              if [ "${status}" -eq 124 ]; then
                echo "::error::${label} timed out after ${duration}"
              fi

              return "${status}"
            }

            run_with_timeout "GloriousFlywheel cache-first validation" "${OMUX_GF_CHECK_TIMEOUT:-25m}" nix develop --command just check-local

  test:
    runs-on: tinyland-nix
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Detect GloriousFlywheel action access
        id: gf
        shell: bash
        env:
          GF_ACTIONS_TOKEN: ${{ secrets.GF_ACTIONS_TOKEN || '' }}
        run: |
          if [ -n "${GF_ACTIONS_TOKEN:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require remote runner substrate
        if: steps.gf.outputs.enabled != 'true'
        shell: bash
        run: |
          echo "GF_ACTIONS_TOKEN is required for CI validation." >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow is remote-first and has no GitHub-hosted local fallback." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Checkout GloriousFlywheel action
        if: steps.gf.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: tinyland-inc/GloriousFlywheel
          ref: main
          path: .gloriousflywheel
          token: ${{ secrets.GF_ACTIONS_TOKEN }}
          persist-credentials: false

      - name: Run test lane on GloriousFlywheel
        uses: ./.gloriousflywheel/.github/actions/nix-job
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN || '' }}
        with:
          attic-public-key: ${{ vars.ATTIC_PUBLIC_KEY || '' }}
          push-cache: ${{ github.event_name == 'push' && 'true' || 'false' }}
          command: |
            set -euxo pipefail
            test -n "${ATTIC_SERVER:-}"
            test -n "${ATTIC_CACHE:-}"
            test -n "${NIX_CONFIG:-}"

            run_with_timeout() {
              local label="$1"
              local duration="$2"
              shift 2

              if ! command -v timeout >/dev/null 2>&1; then
                echo "::warning::GNU timeout is unavailable; running ${label} without an inner timeout"
                "$@"
                return
              fi

              set +e
              timeout --foreground "${duration}" "$@"
              local status=$?
              set -e

              if [ "${status}" -eq 124 ]; then
                echo "::error::${label} timed out after ${duration}"
              fi

              return "${status}"
            }

            run_with_timeout "remote test lane" "${OMUX_GF_TEST_TIMEOUT:-25m}" nix develop --command bash -lc '
              set -euxo pipefail
              zig build
              zig build test
              for cfg in examples/*.config.json; do
                OMUX_CONFIG="$PWD/$cfg" ./zig-out/bin/oauth-mux config validate
              done
              ./scripts/e2e-local.sh
              zig build -Doptimize=ReleaseSafe
              ls -lh zig-out/bin/oauth-mux
            '

  cross-compile:
    runs-on: tinyland-nix
    timeout-minutes: 30
    strategy:
      matrix:
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows
          - aarch64-windows
    steps:
      - uses: actions/checkout@v4

      - name: Detect GloriousFlywheel action access
        id: gf
        shell: bash
        env:
          GF_ACTIONS_TOKEN: ${{ secrets.GF_ACTIONS_TOKEN || '' }}
        run: |
          if [ -n "${GF_ACTIONS_TOKEN:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require remote runner substrate
        if: steps.gf.outputs.enabled != 'true'
        shell: bash
        run: |
          echo "GF_ACTIONS_TOKEN is required for CI validation." >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow is remote-first and has no GitHub-hosted local fallback." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Checkout GloriousFlywheel action
        if: steps.gf.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: tinyland-inc/GloriousFlywheel
          ref: main
          path: .gloriousflywheel
          token: ${{ secrets.GF_ACTIONS_TOKEN }}
          persist-credentials: false

      - name: Build ${{ matrix.target }} on GloriousFlywheel
        uses: ./.gloriousflywheel/.github/actions/nix-job
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN || '' }}
        with:
          attic-public-key: ${{ vars.ATTIC_PUBLIC_KEY || '' }}
          push-cache: ${{ github.event_name == 'push' && 'true' || 'false' }}
          command: |
            set -euxo pipefail
            test -n "${ATTIC_SERVER:-}"
            test -n "${ATTIC_CACHE:-}"
            test -n "${NIX_CONFIG:-}"

            run_with_timeout() {
              local label="$1"
              local duration="$2"
              shift 2

              if ! command -v timeout >/dev/null 2>&1; then
                echo "::warning::GNU timeout is unavailable; running ${label} without an inner timeout"
                "$@"
                return
              fi

              set +e
              timeout --foreground "${duration}" "$@"
              local status=$?
              set -e

              if [ "${status}" -eq 124 ]; then
                echo "::error::${label} timed out after ${duration}"
              fi

              return "${status}"
            }

            run_with_timeout "remote cross-compile ${{ matrix.target }}" "${OMUX_GF_CROSS_TIMEOUT:-20m}" nix develop --command bash -lc '
              set -euxo pipefail
              zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe
              ls -lh zig-out/bin/omux* zig-out/bin/oauth-mux*
              file zig-out/bin/omux* zig-out/bin/oauth-mux*
            '

      - uses: actions/upload-artifact@v4
        with:
          name: oauth-mux-${{ matrix.target }}
          path: |
            zig-out/bin/omux*
            zig-out/bin/oauth-mux*

  nix:
    runs-on: tinyland-nix
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Detect GloriousFlywheel action access
        id: gf
        shell: bash
        env:
          GF_ACTIONS_TOKEN: ${{ secrets.GF_ACTIONS_TOKEN || '' }}
        run: |
          if [ -n "${GF_ACTIONS_TOKEN:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require remote runner substrate
        if: steps.gf.outputs.enabled != 'true'
        shell: bash
        run: |
          echo "GF_ACTIONS_TOKEN is required for CI validation." >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow is remote-first and has no GitHub-hosted local fallback." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Checkout GloriousFlywheel action
        if: steps.gf.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: tinyland-inc/GloriousFlywheel
          ref: main
          path: .gloriousflywheel
          token: ${{ secrets.GF_ACTIONS_TOKEN }}
          persist-credentials: false

      - name: Run Nix lane on GloriousFlywheel
        uses: ./.gloriousflywheel/.github/actions/nix-job
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN || '' }}
        with:
          attic-public-key: ${{ vars.ATTIC_PUBLIC_KEY || '' }}
          push-cache: ${{ github.event_name == 'push' && 'true' || 'false' }}
          command: |
            set -euxo pipefail
            test -n "${ATTIC_SERVER:-}"
            test -n "${ATTIC_CACHE:-}"
            test -n "${NIX_CONFIG:-}"

            run_with_timeout() {
              local label="$1"
              local duration="$2"
              shift 2

              if ! command -v timeout >/dev/null 2>&1; then
                echo "::warning::GNU timeout is unavailable; running ${label} without an inner timeout"
                "$@"
                return
              fi

              set +e
              timeout --foreground "${duration}" "$@"
              local status=$?
              set -e

              if [ "${status}" -eq 124 ]; then
                echo "::error::${label} timed out after ${duration}"
              fi

              return "${status}"
            }

            run_with_timeout "remote nix build" "${OMUX_GF_NIX_TIMEOUT:-25m}" nix build .#
            run_with_timeout "remote nix check" "${OMUX_GF_NIX_TIMEOUT:-25m}" nix flake check
