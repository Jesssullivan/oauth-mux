name: CI

on:
  push:
    branches: [main, initial-implementation]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  cache-first:
    name: GloriousFlywheel cache-first check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # R331: tinyland-inc/GloriousFlywheel is private now, so the App-token
    # checkout-and-local-path dance this job used to reach its private
    # nix-job action is retired. tinyland-nix (the shared tinyland-inc org
    # pool) is also unreachable from this personal, out-of-org repo — GitHub
    # self-hosted runner groups do not cross an org/personal-account
    # boundary. jesssullivan-nix is the owner-overlay capability class
    # (jesssullivan-infra) that actually serves this account's repos.
    runs-on: jesssullivan-nix
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Nix (ci-templates)
        uses: tinyland-inc/ci-templates/.github/actions/nix-setup@d8d178c022a0f84853d53a2c8fe0fc90115f0949 # v3.1.0

      # NOTE (R331): cache-push on trusted main-branch pushes (the old
      # `push-cache: github.event_name == 'push'` behavior) is not carried
      # forward here. ci-templates' nix-setup is read-only cache-hint
      # detection; there is no drop-in equivalent for GF nix-job's
      # attic-token-gated push in this repo's Bazel-free Zig build. Restoring
      # write-side caching is tracked as follow-up, not invented here.
      - name: Run cache-first validation
        shell: bash
        run: |
          # shellcheck disable=SC2016
# GH ${{ }} expressions inside the single-quoted bash -lc wrapper are
          # bash -lc wrapper are substituted by Actions BEFORE the shell parses them;
          # the quoting is correct (review: oauth-mux #526).
          set -euxo pipefail

          run_with_timeout() {
            local label="$1"
            local duration="$2"
            shift 2

            if ! command -v timeout >/dev/null 2>&1; then
              echo "::warning::GNU timeout is unavailable; running ${label} without an inner timeout"
              "$@"
              return
            fi

            set +e
            timeout --foreground "${duration}" "$@"
            local status=$?
            set -e

            if [ "${status}" -eq 124 ]; then
              echo "::error::${label} timed out after ${duration}"
            fi

            return "${status}"
          }

          run_with_timeout "GloriousFlywheel cache-first validation" "${OMUX_GF_CHECK_TIMEOUT:-25m}" nix develop --command just check-local

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # R331: see cache-first above.
    runs-on: jesssullivan-nix
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Nix (ci-templates)
        uses: tinyland-inc/ci-templates/.github/actions/nix-setup@d8d178c022a0f84853d53a2c8fe0fc90115f0949 # v3.1.0

      - name: Run test lane
        shell: bash
        run: |
          # shellcheck disable=SC2016
# GH ${{ }} expressions inside the single-quoted bash -lc wrapper are
          # bash -lc wrapper are substituted by Actions BEFORE the shell parses them;
          # the quoting is correct (review: oauth-mux #526).
          set -euxo pipefail

          run_with_timeout() {
            local label="$1"
            local duration="$2"
            shift 2

            if ! command -v timeout >/dev/null 2>&1; then
              echo "::warning::GNU timeout is unavailable; running ${label} without an inner timeout"
              "$@"
              return
            fi

            set +e
            timeout --foreground "${duration}" "$@"
            local status=$?
            set -e

            if [ "${status}" -eq 124 ]; then
              echo "::error::${label} timed out after ${duration}"
            fi

            return "${status}"
          }

          run_with_timeout "remote test lane" "${OMUX_GF_TEST_TIMEOUT:-25m}" nix develop --command bash -lc '
            set -euxo pipefail
            zig build
            zig build test
            for cfg in examples/*.config.json; do
              OMUX_CONFIG="$PWD/$cfg" ./zig-out/bin/oauth-mux config validate
            done
            ./scripts/e2e-local.sh
            zig build -Doptimize=ReleaseSafe
            ls -lh zig-out/bin/oauth-mux
          '

  cross-compile:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # R331: see cache-first above.
    runs-on: jesssullivan-nix
    timeout-minutes: 30
    strategy:
      matrix:
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows
          - aarch64-windows
    steps:
      - uses: actions/checkout@v4

      - name: Set up Nix (ci-templates)
        uses: tinyland-inc/ci-templates/.github/actions/nix-setup@d8d178c022a0f84853d53a2c8fe0fc90115f0949 # v3.1.0

      - name: Build ${{ matrix.target }}
        shell: bash
        run: |
          # shellcheck disable=SC2016
# GH ${{ }} expressions inside the single-quoted bash -lc wrapper are
          # bash -lc wrapper are substituted by Actions BEFORE the shell parses them;
          # the quoting is correct (review: oauth-mux #526).
          set -euxo pipefail

          run_with_timeout() {
            local label="$1"
            local duration="$2"
            shift 2

            if ! command -v timeout >/dev/null 2>&1; then
              echo "::warning::GNU timeout is unavailable; running ${label} without an inner timeout"
              "$@"
              return
            fi

            set +e
            timeout --foreground "${duration}" "$@"
            local status=$?
            set -e

            if [ "${status}" -eq 124 ]; then
              echo "::error::${label} timed out after ${duration}"
            fi

            return "${status}"
          }

          run_with_timeout "remote cross-compile ${{ matrix.target }}" "${OMUX_GF_CROSS_TIMEOUT:-20m}" nix develop --command bash -lc '
            set -euxo pipefail
            zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe
            ls -lh zig-out/bin/omux* zig-out/bin/oauth-mux*
            file zig-out/bin/omux* zig-out/bin/oauth-mux*
          '

      - uses: actions/upload-artifact@v4
        with:
          name: oauth-mux-${{ matrix.target }}
          path: |
            zig-out/bin/omux*
            zig-out/bin/oauth-mux*
          retention-days: 7

  nix:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # R331: see cache-first above.
    runs-on: jesssullivan-nix
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Nix (ci-templates)
        uses: tinyland-inc/ci-templates/.github/actions/nix-setup@d8d178c022a0f84853d53a2c8fe0fc90115f0949 # v3.1.0

      - name: Run Nix lane
        shell: bash
        run: |
          set -euxo pipefail

          run_with_timeout() {
            local label="$1"
            local duration="$2"
            shift 2

            if ! command -v timeout >/dev/null 2>&1; then
              echo "::warning::GNU timeout is unavailable; running ${label} without an inner timeout"
              "$@"
              return
            fi

            set +e
            timeout --foreground "${duration}" "$@"
            local status=$?
            set -e

            if [ "${status}" -eq 124 ]; then
              echo "::error::${label} timed out after ${duration}"
            fi

            return "${status}"
          }

          run_with_timeout "remote nix build" "${OMUX_GF_NIX_TIMEOUT:-25m}" nix build .#
          run_with_timeout "remote nix check" "${OMUX_GF_NIX_TIMEOUT:-25m}" nix flake check
