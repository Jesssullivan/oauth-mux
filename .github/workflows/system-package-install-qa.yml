name: System Package Install QA

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published version to install from GitHub Release assets"
        required: true
        type: string
      expect_codex_shim:
        description: "Require published deb/rpm packages to include /usr/bin/codex"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  system-package-install-qa:
    name: deb/rpm install from published release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install published deb/rpm packages in Linux containers
        shell: bash
        env:
          OMUX_PUBLISHED_RELEASE_VERSION: ${{ inputs.version }}
          OMUX_EXPECT_CODEX_SHIM_INPUT: ${{ inputs.expect_codex_shim }}
        run: |
          set -euo pipefail
          if [ "$OMUX_EXPECT_CODEX_SHIM_INPUT" = "true" ]; then
            export OMUX_EXPECT_CODEX_SHIM=1
          fi
          ./scripts/system-package-install-qa.sh "$OMUX_PUBLISHED_RELEASE_VERSION"
