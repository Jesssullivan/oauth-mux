name: System Package Install QA

on:
  pull_request:
    paths:
      - ".github/workflows/system-package-install-qa.yml"
      - "scripts/system-package-install-qa.sh"
      - "docs/install-beta-matrix.md"
      - "docs/release-runbook.md"
      - "justfile"
  workflow_dispatch:
    inputs:
      version:
        description: "Published version to install from GitHub Release assets"
        required: false
        default: "0.1.9"
        type: string
      expect_codex_shim:
        description: "Require published deb/rpm packages to include /usr/bin/codex"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  system-package-install-qa:
    name: deb/rpm install from published release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install published deb/rpm packages in Linux containers
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then
            version="0.1.9"
          fi
          if [ "${{ github.event.inputs.expect_codex_shim }}" = "true" ]; then
            export OMUX_EXPECT_CODEX_SHIM=1
          fi
          ./scripts/system-package-install-qa.sh "$version"
