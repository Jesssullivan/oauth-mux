name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  authorize-stable-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Require the stable v0.1 tag family
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v0\.1\.[0-9]+$ ]]; then
            echo "release.yml only publishes stable v0.1 patch tags" >&2
            exit 1
          fi

  build:
    needs: authorize-stable-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build and smoke-test release artifacts
        run: |
          nix develop --command just release-proof-local "${GITHUB_REF_NAME#v}"

      - name: Upload release staging
        uses: actions/upload-artifact@v4
        with:
          name: oauth-mux-release-${{ github.ref_name }}
          path: dist/out/
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            v*/artifacts/*
            v*/homebrew/oauth-mux.rb
            v*/handoff/*
          generate_release_notes: true
          prerelease: false
          make_latest: true
