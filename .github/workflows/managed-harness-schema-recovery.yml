name: Managed Harness Schema Recovery

on:
  push:
    branches:
      - jess/tin-1798-schema-generation-recovery-20260713

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  generate:
    name: Generate managed-harness schema from public Nix inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Generate and check contract artifacts
        run: |
          set -euxo pipefail
          nix develop --command bash -lc '
            set -euxo pipefail
            zig fmt src/managed_harness_contract.zig
            zig build update-managed-harness-schema
            zig test src/managed_harness_contract.zig
            zig build check-managed-harness-schema
            ./scripts/check-managed-harness-instances.sh
          '

      - name: Upload deterministic outputs
        uses: actions/upload-artifact@v4
        with:
          name: managed-harness-schema-recovery
          if-no-files-found: error
          path: |
            src/managed_harness_contract.zig
            schemas/managed-harness-jsonrpc-v2.schema.json
