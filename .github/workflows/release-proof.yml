name: Release Proof

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to stage and smoke-test"
        required: false
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  cache-first-release-proof:
    name: GloriousFlywheel release proof
    runs-on: tinyland-nix
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Checkout GloriousFlywheel action
        uses: ./.github/actions/checkout-gloriousflywheel
        with:
          app-id: ${{ secrets.GF_ACTIONS_APP_ID }}
          private-key: ${{ secrets.GF_ACTIONS_APP_PRIVATE_KEY }}

      - name: Run cache-first release proof
        uses: ./.gloriousflywheel/.github/actions/nix-job
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN || '' }}
          OMUX_REQUESTED_RELEASE_VERSION: ${{ inputs.version || '' }}
        with:
          attic-public-key: ${{ vars.ATTIC_PUBLIC_KEY || '' }}
          push-cache: "false"
          command: |
            set -euxo pipefail
            test -n "${ATTIC_SERVER:-}"
            test -n "${ATTIC_CACHE:-}"
            test -n "${NIX_CONFIG:-}"

            run_with_timeout() {
              local label="$1"
              local duration="$2"
              shift 2

              if ! command -v timeout >/dev/null 2>&1; then
                echo "::warning::GNU timeout is unavailable; running ${label} without an inner timeout"
                "$@"
                return
              fi

              set +e
              timeout --foreground "${duration}" "$@"
              local status=$?
              set -e

              if [ "${status}" -eq 124 ]; then
                echo "::error::${label} timed out after ${duration}"
              fi

              return "${status}"
            }

            release_version="$(./scripts/resolve-release-version.sh "${OMUX_REQUESTED_RELEASE_VERSION}")"
            run_with_timeout "GloriousFlywheel release proof" "${OMUX_GF_RELEASE_PROOF_TIMEOUT:-40m}" nix develop --command just release-proof-local "${release_version}"
