name: Release Proof

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to stage and smoke-test"
        required: false
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  cache-first-release-proof:
    name: GloriousFlywheel release proof
    # R331: tinyland-inc/GloriousFlywheel is private now, and the shared
    # tinyland-nix org pool is unreachable from this personal, out-of-org
    # repo. jesssullivan-nix is the owner-overlay capability class that
    # actually serves this account's repos — see ci.yml for the full note.
    runs-on: jesssullivan-nix
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Nix (ci-templates)
        uses: tinyland-inc/ci-templates/.github/actions/nix-setup@d8d178c022a0f84853d53a2c8fe0fc90115f0949 # v3.1.0

      - name: Run cache-first release proof
        shell: bash
        env:
          OMUX_REQUESTED_RELEASE_VERSION: ${{ inputs.version || '' }}
        run: |
          set -euxo pipefail

          run_with_timeout() {
            local label="$1"
            local duration="$2"
            shift 2

            if ! command -v timeout >/dev/null 2>&1; then
              echo "::warning::GNU timeout is unavailable; running ${label} without an inner timeout"
              "$@"
              return
            fi

            set +e
            timeout --foreground "${duration}" "$@"
            local status=$?
            set -e

            if [ "${status}" -eq 124 ]; then
              echo "::error::${label} timed out after ${duration}"
            fi

            return "${status}"
          }

          release_version="$(./scripts/resolve-release-version.sh "${OMUX_REQUESTED_RELEASE_VERSION}")"
          run_with_timeout "GloriousFlywheel release proof" "${OMUX_GF_RELEASE_PROOF_TIMEOUT:-40m}" nix develop --command just release-proof-local "${release_version}"
