name: NPM Publish

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type publish-npm to publish npm tarballs from CI artifacts"
        required: true
        type: string
      version:
        description: "Version to stage and publish"
        required: false
        default: "0.1.12"
        type: string
      dry_run:
        description: "Run npm publish --dry-run instead of publishing"
        required: false
        default: true
        type: boolean
      provenance:
        description: "Attach npm provenance; requires a public GitHub source repository"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  npm-publish:
    name: npm publish from release derivation
    if: inputs.confirm == 'publish-npm'
    runs-on: ubuntu-latest
    environment: npm-production
    env:
      OMUX_GLOBAL_SOPS_B64_PRESENT: ${{ secrets.OMUX_GLOBAL_SOPS_B64 != '' }}
      OMUX_GLOBAL_SOPS_REPOSITORY_PRESENT: ${{ vars.OMUX_GLOBAL_SOPS_REPOSITORY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Decode global SOPS file
        if: env.OMUX_GLOBAL_SOPS_B64_PRESENT == 'true'
        shell: bash
        env:
          OMUX_GLOBAL_SOPS_B64: ${{ secrets.OMUX_GLOBAL_SOPS_B64 }}
        run: |
          set -euo pipefail
          global_sops="$RUNNER_TEMP/omux-global.sops.yaml"
          printf '%s' "$OMUX_GLOBAL_SOPS_B64" | base64 -d > "$global_sops"
          chmod 0600 "$global_sops"
          echo "OMUX_NPM_TOKEN_SOPS_FILE=$global_sops" >> "$GITHUB_ENV"

      - name: Checkout global SOPS repo
        if: env.OMUX_GLOBAL_SOPS_B64_PRESENT != 'true' && env.OMUX_GLOBAL_SOPS_REPOSITORY_PRESENT == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.OMUX_GLOBAL_SOPS_REPOSITORY }}
          ref: ${{ vars.OMUX_GLOBAL_SOPS_REF || 'main' }}
          path: .global-sops
          token: ${{ secrets.GF_ACTIONS_TOKEN || github.token }}
          persist-credentials: false

      - name: Configure checked-out SOPS file
        if: env.OMUX_GLOBAL_SOPS_B64_PRESENT != 'true' && env.OMUX_GLOBAL_SOPS_REPOSITORY_PRESENT == 'true'
        shell: bash
        env:
          OMUX_GLOBAL_SOPS_FILE: ${{ vars.OMUX_GLOBAL_SOPS_FILE || 'nix/secrets/common.yaml' }}
        run: |
          set -euo pipefail
          echo "OMUX_NPM_TOKEN_SOPS_FILE=$PWD/.global-sops/$OMUX_GLOBAL_SOPS_FILE" >> "$GITHUB_ENV"

      - name: Stage release proof
        run: nix develop --command just release-proof-local "${{ inputs.version }}"

      - name: Publish npm tarballs from staged artifacts
        shell: bash
        env:
          OMUX_NPM_PUBLISH_CONFIRM: publish-npm
          OMUX_NPM_TOKEN_SOPS_KEY: ${{ vars.OMUX_NPM_TOKEN_SOPS_KEY || '.api.npm_token' }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN || '' }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || '' }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY || '' }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            export OMUX_NPM_PUBLISH_DRY_RUN=1
          fi
          if [ "${{ inputs.provenance }}" != "true" ]; then
            export OMUX_NPM_PUBLISH_PROVENANCE=0
          fi
          nix develop --command ./scripts/npm-ci-publish.sh "${{ inputs.version }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-publish-${{ inputs.version }}
          path: dist/out/**/handoff/
          if-no-files-found: ignore
