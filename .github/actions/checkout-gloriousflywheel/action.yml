name: Checkout GloriousFlywheel
description: Mint a repository-scoped GitHub App token and check out the private GF action source.

inputs:
  app-id:
    description: GitHub App id with read access to tinyland-inc/GloriousFlywheel
    required: true
  private-key:
    description: GitHub App private key used only to mint the scoped installation token
    required: true

runs:
  using: composite
  steps:
    - name: Require GloriousFlywheel checkout authority
      shell: bash
      env:
        GF_ACTIONS_APP_ID: ${{ inputs.app-id }}
        GF_ACTIONS_APP_PRIVATE_KEY: ${{ inputs.private-key }}
      run: |
        if [ -z "${GF_ACTIONS_APP_ID:-}" ] || [ -z "${GF_ACTIONS_APP_PRIVATE_KEY:-}" ]; then
          echo "GloriousFlywheel GitHub App credentials are required for remote validation." >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow is remote-first and has no local or broad-token fallback." >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

    - name: Mint scoped GloriousFlywheel checkout token
      id: token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: tinyland-inc
        repositories: GloriousFlywheel
        permission-contents: read

    - name: Checkout GloriousFlywheel action
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        repository: tinyland-inc/GloriousFlywheel
        ref: 2357988536f1f6258291c363e1428962b6cced1b
        path: .gloriousflywheel
        token: ${{ steps.token.outputs.token }}
        persist-credentials: false

    - name: Verify GloriousFlywheel action revision
      shell: bash
      env:
        GF_ACTION_SHA: 2357988536f1f6258291c363e1428962b6cced1b
      run: |
        set -euo pipefail
        actual_sha="$(git -C "${GITHUB_WORKSPACE}/.gloriousflywheel" rev-parse --verify 'HEAD^{commit}')"
        if [ "${actual_sha}" != "${GF_ACTION_SHA}" ]; then
          echo "GloriousFlywheel checkout ${actual_sha} does not match ${GF_ACTION_SHA}." >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
